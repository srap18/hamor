name: Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      # نُنشئ dist/ احتياطي بـ index.html بسيط يُعيد التوجيه للموقع.
      # التطبيق الفعلي يُحمَّل من server.url في capacitor.config.ts،
      # لكن Capacitor sync يتطلب أن يكون webDir موجوداً وفيه ملف. 
      - name: Prepare webDir fallback
        run: |
          mkdir -p dist
          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html lang="ar" dir="rtl">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
              <title>ملوك القراصنة</title>
              <meta http-equiv="refresh" content="0;url=https://www.molok-alqarasna.com/" />
            </head>
            <body style="background:#000;color:#fff;font-family:system-ui;text-align:center;padding:40px">
              جاري تحميل اللعبة...
              <script>location.replace('https://www.molok-alqarasna.com/');</script>
            </body>
          </html>
          EOF

      # ⚠️ مهم جداً: لا نحذف مجلد android/ ولا نعيد إنشاءه.
      # المجلد الموجود في المستودع يحتوي على:
      #   - Google Play Billing 8.0.0 + Install Referrer 2.2  (build.gradle) 
      #   - إذن com.android.vending.BILLING  (AndroidManifest.xml) 
      #   - MainActivity المخصصة (أوفلاين + أذونات in-context) 
      #   - network_security_config, data_extraction_rules, styles, colors... 
      # حذف المجلد كان يُلغي كل هذا قبل البناء، فيصدر APK بدون فوترة ولا Install Referrer. 
      #
      # Capacitor sync فقط ينسخ ملفات الويب والإضافات إلى المشروع الموجود
      # ولا يمس build.gradle ولا AndroidManifest.xml.
      - name: Capacitor sync (preserve repo android/)
        run: |
          mkdir -p android/app/src/main/assets
          bunx cap sync android
          chmod +x android/gradlew

      # التحقق من أن مكتبات المتجر والإذن موجودة فعلاً في التسليمة قبل البناء.
      # لو انكسر أي منها نفشل مبكراً بدل ما نرفع AAB معطوب لـ Play Console.
      - name: Verify Play Billing & Install Referrer are present
        run: |
          set -euo pipefail
          echo "== build.gradle deps =="
          grep -q "com.android.billingclient:billing" android/app/build.gradle \
            || (echo "ERROR: Play Billing dependency missing" && exit 1)
          grep -q "com.android.installreferrer:installreferrer" android/app/build.gradle \
            || (echo "ERROR: Install Referrer dependency missing" && exit 1)
          echo "== AndroidManifest permissions =="
          grep -q "com.android.vending.BILLING" android/app/src/main/AndroidManifest.xml \
            || (echo "ERROR: BILLING permission missing" && exit 1)
          echo "== resolved release dependencies =="
          cd android
          ./gradlew :app:dependencyInsight \
            --dependency com.android.billingclient:billing \
            --configuration releaseRuntimeClasspath \
            --no-daemon > /tmp/billing-dependency.txt
          ./gradlew :app:dependencyInsight \
            --dependency com.android.installreferrer:installreferrer \
            --configuration releaseRuntimeClasspath \
            --no-daemon > /tmp/referrer-dependency.txt
          grep -q "com.android.billingclient:billing:8.0.0" /tmp/billing-dependency.txt \
            || (cat /tmp/billing-dependency.txt && echo "ERROR: Play Billing 8.0.0 is not on releaseRuntimeClasspath" && exit 1)
          grep -q "com.android.installreferrer:installreferrer:2.2" /tmp/referrer-dependency.txt \
            || (cat /tmp/referrer-dependency.txt && echo "ERROR: Install Referrer 2.2 is not on releaseRuntimeClasspath" && exit 1)
          echo "OK: billing + install referrer resolve for the release bundle and BILLING permission is present."

      - name: Build Unsigned Release APK and AAB
        run: |
          cd android
          # تحديث رقم الإصدار تلقائياً
          sed -i 's/versionCode [0-9]*/versionCode 1010/' app/build.gradle
          ./gradlew clean assembleRelease bundleRelease --no-daemon --stacktrace

      # التحقق النهائي من ملفات DEX داخل الـ AAB. ملفات AAB لا تخزن كلاسات
      # Java كمسارات منفصلة؛ لذلك فحص `unzip -l` بحثاً عن com/android/... يعطي
      # نتيجة سالبة كاذبة دائماً. نفك نصوص DEX ونبحث عن واصفات الكلاسات الفعلية.
      - name: Verify libraries are bundled inside AAB
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || (echo "ERROR: AAB not produced" && exit 1)

          mapfile -t DEX_FILES < <(unzip -Z1 "$AAB" | grep -E '^base/dex/classes([0-9]*)?\.dex$')
          test "${#DEX_FILES[@]}" -gt 0 \
            || (echo "ERROR: no base DEX files found in AAB" && exit 1)

          : > /tmp/aab-dex-strings.txt
          for dex in "${DEX_FILES[@]}"; do
            echo "Inspecting $dex"
            unzip -p "$AAB" "$dex" | strings >> /tmp/aab-dex-strings.txt
          done

          grep -Fq "Lcom/android/billingclient/api/BillingClient;" /tmp/aab-dex-strings.txt \
            || (echo "ERROR: BillingClient class descriptor not found in AAB DEX" && exit 1)
          grep -Fq "Lcom/android/installreferrer/api/InstallReferrerClient;" /tmp/aab-dex-strings.txt \
            || (echo "ERROR: InstallReferrerClient class descriptor not found in AAB DEX" && exit 1)
          echo "OK: Play Billing + Install Referrer classes are bundled in the AAB."

      - name: Upload Unsigned Outputs
        uses: actions/upload-artifact@v4
        with:
          name: android-release-unsigned
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
